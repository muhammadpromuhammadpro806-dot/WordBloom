name: Build WordBloom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Setup www
        run: mkdir -p www && cp index.html www/index.html

      - name: Remove old android folder
        run: rm -rf android

      - name: Init Capacitor
        run: npx cap init WordBloom com.wordbloom.app --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Remove bad Java path
        run: grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties || true

      - name: Force API 35 and version code 2
        run: |
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 35/g' android/app/build.gradle
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' android/app/build.gradle
          sed -i 's/targetSdk [0-9]*/targetSdk 35/g' android/app/build.gradle
          sed -i 's/versionCode [0-9]*/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/g' android/app/build.gradle
          echo "=== Versions ==="
          grep -E "compileSdk|targetSdk|versionCode|versionName" android/app/build.gradle

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/wordbloom.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias wordbloom \
            -storetype JKS \
            -storepass shafiq123 \
            -keypass shafiq123 \
            -dname "CN=Muhammad Shafiq, OU=WordBloom, O=WordBloom, L=Lalamusa, ST=Punjab, C=PK"
          echo "=== SHA1 ==="
          keytool -list -v -keystore android/app/wordbloom.jks -storepass shafiq123 2>/dev/null | grep "SHA1:"

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("wordbloom.jks")
                      storePassword "shafiq123"
                      keyAlias "wordbloom"
                      keyPassword "shafiq123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordBloom-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordbloom-apk
          path: android/app/build/outputs/apk/release/app-release.apk
