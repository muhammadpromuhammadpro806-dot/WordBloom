name: Build WordBloom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Setup www
        run: mkdir -p www && cp index.html www/index.html

      - name: Remove old android folder
        run: rm -rf android

      - name: Init Capacitor
        run: npx cap init WordBloom com.wordbloom.app --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Remove bad Java path
        run: grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties || true

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/wordbloom.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias wordbloom \
            -storetype JKS \
            -storepass shafiq123 \
            -keypass shafiq123 \
            -dname "CN=Muhammad Shafiq, OU=WordBloom, O=WordBloom, L=Lalamusa, ST=Punjab, C=PK"
          echo "=== SHA1 ==="
          keytool -list -v -keystore android/app/wordbloom.jks -storepass shafiq123 2>/dev/null | grep "SHA1:"

      - name: Update build.gradle with signing and API 35
        run: |
          python3 << 'PYTHON'
          import re
          
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          
          # Update SDK versions
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
          content = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', content)
          content = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', content)
          content = re.sub(r'versionCode\s+\d+', 'versionCode 2', content)
          content = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.1"', content)
          
          # Add signing config inside existing android block
          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file("wordbloom.jks")
                      storePassword "shafiq123"
                      keyAlias "wordbloom"
                      keyPassword "shafiq123"
                  }
              }
          '''
          
          # Add signingConfig to release buildType
          content = content.replace(
              'release {',
              'release {\n                signingConfig signingConfigs.release',
              1
          )
          
          # Insert signingConfigs before buildTypes
          content = content.replace(
              '    buildTypes {',
              signing_config + '    buildTypes {',
              1
          )
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          
          print("build.gradle updated!")
          PYTHON
          echo "=== Versions ==="
          grep -E "compileSdk|targetSdk|versionCode|versionName" android/app/build.gradle

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordBloom-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordbloom-apk
          path: android/app/build/outputs/apk/release/app-release.apk
