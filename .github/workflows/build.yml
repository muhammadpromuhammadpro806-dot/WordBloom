name: Build WordBloom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Setup www
        run: mkdir -p www && cp index.html www/index.html

      - name: Remove old android folder
        run: rm -rf android

      - name: Init Capacitor
        run: npx cap init WordBloom com.wordbloom.app --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Remove bad Java path
        run: grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties || true

      - name: Update SDK and version
        run: |
          sed -i 's/targetSdkVersion 33/targetSdkVersion 35/g' android/app/build.gradle
          sed -i 's/targetSdk 33/targetSdk 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 33/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/compileSdk 33/compileSdk 35/g' android/app/build.gradle

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/wordbloom.jks
          echo "=== SHA1 of saved keystore ==="
          keytool -list -v -keystore android/app/wordbloom.jks -storepass shafiq123 2>/dev/null | grep "SHA1:"

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("wordbloom.jks")
                      storePassword "shafiq123"
                      keyAlias "wordbloom"
                      keyPassword "shafiq123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordBloom-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordbloom-apk
          path: android/app/build/outputs/apk/release/app-release.apk
