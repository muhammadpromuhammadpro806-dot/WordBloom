name: Build WordBloom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Setup www
        run: mkdir -p www && cp index.html www/index.html

      - name: Remove old android folder
        run: rm -rf android

      - name: Init Capacitor
        run: npx cap init WordBloom com.wordbloom.game1 --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Remove bad Java path
        run: grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties || true

      - name: Use or generate keystore
        run: |
          if [ -f "keystore/wordbloom.jks" ]; then
            echo "Using saved keystore from repo!"
            cp keystore/wordbloom.jks android/app/wordbloom.jks
          else
            echo "Generating new keystore..."
            mkdir -p keystore
            keytool -genkey -v \
              -keystore android/app/wordbloom.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias wordbloom \
              -storetype JKS \
              -storepass shafiq123 \
              -keypass shafiq123 \
              -dname "CN=Muhammad Shafiq, OU=WordBloom, O=WordBloom, L=Lalamusa, ST=Punjab, C=PK"
            cp android/app/wordbloom.jks keystore/wordbloom.jks
          fi
          echo "=== SHA1 ==="
          keytool -list -v -keystore android/app/wordbloom.jks -storepass shafiq123 2>/dev/null | grep "SHA1:"

      - name: Save keystore to repo
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add keystore/wordbloom.jks || true
          git diff --staged --quiet || git commit -m "Save keystore" || true
          git push || true

      - name: Update build.gradle
        run: |
          python3 - << 'PYTHON'
          import re
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
          content = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', content)
          content = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', content)
          content = re.sub(r'versionCode\s+\d+', 'versionCode 1', content)
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("wordbloom.jks")
                      storePassword "shafiq123"
                      keyAlias "wordbloom"
                      keyPassword "shafiq123"
                  }
              }
          '''
          content = content.replace('release {', 'release {\n                signingConfig signingConfigs.release', 1)
          content = content.replace('    buildTypes {', signing + '    buildTypes {', 1)
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print("targetSdk:", re.findall(r'targetSdk\s+\d+', content))
          PYTHON

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordBloom-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordbloom-apk
          path: android/app/build/outputs/apk/release/app-release.apk
