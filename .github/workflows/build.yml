name: Build WordBloom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Setup www
        run: mkdir -p www && cp index.html www/index.html

      - name: Remove old android folder
        run: rm -rf android

      - name: Init Capacitor
        run: npx cap init WordBloom com.wordbloom.game1 --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Remove bad Java path
        run: grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties || true

      - name: Use or generate keystore
        run: |
          if [ -f "keystore/wordbloom.jks" ]; then
            echo "Using saved keystore!"
            cp keystore/wordbloom.jks android/app/wordbloom.jks
          else
            echo "Generating new keystore..."
            mkdir -p keystore
            keytool -genkey -v \
              -keystore android/app/wordbloom.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias wordbloom \
              -storetype JKS \
              -storepass shafiq123 \
              -keypass shafiq123 \
              -dname "CN=Muhammad Shafiq, OU=WordBloom, O=WordBloom, L=Lalamusa, ST=Punjab, C=PK"
            cp android/app/wordbloom.jks keystore/wordbloom.jks
          fi
          echo "=== SHA1 ==="
          keytool -list -v -keystore android/app/wordbloom.jks -storepass shafiq123 2>/dev/null | grep "SHA1:"

      - name: Save keystore to repo
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add keystore/wordbloom.jks || true
          git diff --staged --quiet || git commit -m "Save keystore" || true
          git push || true

      - name: Force API 35 in build.gradle
        run: |
          echo "=== Before ==="
          grep -E "compileSdk|targetSdk|minSdk|versionCode" android/app/build.gradle
          
          # Use awk to replace values properly
          awk '{
            gsub(/compileSdkVersion [0-9]+/, "compileSdkVersion 35");
            gsub(/compileSdk [0-9]+/, "compileSdk 35");
            gsub(/targetSdkVersion [0-9]+/, "targetSdkVersion 35");
            gsub(/targetSdk [0-9]+/, "targetSdk 35");
            gsub(/minSdkVersion [0-9]+/, "minSdkVersion 22");
            gsub(/minSdk [0-9]+/, "minSdk 22");
            print
          }' android/app/build.gradle > /tmp/build.gradle.tmp
          mv /tmp/build.gradle.tmp android/app/build.gradle
          
          echo "=== After ==="
          grep -E "compileSdk|targetSdk|minSdk|versionCode" android/app/build.gradle

      - name: Add signing config to build.gradle
        run: |
          cat >> android/app/build.gradle << 'GRADLE'
          android.signingConfigs {
              release {
                  storeFile = file("wordbloom.jks")
                  storePassword = "shafiq123"
                  keyAlias = "wordbloom"
                  keyPassword = "shafiq123"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordBloom-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordbloom-apk
          path: android/app/build/outputs/apk/release/app-release.apk
