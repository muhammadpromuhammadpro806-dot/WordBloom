name: Build WordBloom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          rm -rf $ANDROID_HOME/platforms/android-35
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          ls -la $ANDROID_HOME/platforms/android-35/android.jar

      - name: Install dependencies
        run: npm install

      - name: Bundle Firebase into HTML
        run: |
          curl -s https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js -o /tmp/fb-app.js
          curl -s https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js -o /tmp/fb-db.js
          echo "Firebase app: $(wc -c < /tmp/fb-app.js) bytes"
          echo "Firebase db: $(wc -c < /tmp/fb-db.js) bytes"
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('index.html', 'utf8');
            const appJs = fs.readFileSync('/tmp/fb-app.js', 'utf8');
            const dbJs = fs.readFileSync('/tmp/fb-db.js', 'utf8');
            html = html.replace(/<script src=\"https:\/\/www\.gstatic\.com\/firebasejs\/10\.12\.0\/firebase-app-compat\.js\"[^>]*><\/script>/, '<script>' + appJs + '<\/script>');
            html = html.replace(/<script src=\"https:\/\/www\.gstatic\.com\/firebasejs\/10\.12\.0\/firebase-database-compat\.js\"[^>]*><\/script>/, '<script>' + dbJs + '<\/script>');
            fs.writeFileSync('index.html', html);
            console.log('Firebase bundled! New size:', html.length, 'chars');
          "

      - name: Setup www
        run: mkdir -p www && cp index.html www/index.html

      - name: Remove old android folder
        run: rm -rf android

      - name: Init Capacitor
        run: npx cap init WordBloom com.wordbloom.game1 --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Ensure INTERNET permission and network security config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' "$MANIFEST"
          fi
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML
          if ! grep -q "networkSecurityConfig" "$MANIFEST"; then
            sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true" /' "$MANIFEST"
          fi

      - name: Sync
        run: npx cap sync android

      - name: Remove bad Java path
        run: grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties || true

      - name: Upgrade Android Gradle Plugin to support SDK 35
        run: |
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.3.0/" android/build.gradle
          sed -i "s/gradle-[0-9.]*-all/gradle-8.4-all/" android/gradle/wrapper/gradle-wrapper.properties
          echo "AGP: $(grep 'com.android.tools.build' android/build.gradle)"

      - name: Force API 35
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/" android/variables.gradle
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/" android/variables.gradle
            sed -i "s/minSdkVersion = .*/minSdkVersion = 22/" android/variables.gradle
            cat android/variables.gradle
          fi

      - name: Bump version code
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "1.0.1"/' android/app/build.gradle || true

      - name: Use or generate keystore
        run: |
          if [ -f "keystore/wordbloom.jks" ]; then
            echo "Using saved keystore!"
            cp keystore/wordbloom.jks android/app/wordbloom.jks
          else
            echo "Generating new keystore..."
            mkdir -p keystore
            keytool -genkey -v \
              -keystore android/app/wordbloom.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias wordbloom \
              -storetype JKS \
              -storepass shafiq123 \
              -keypass shafiq123 \
              -dname "CN=Muhammad Shafiq, OU=WordBloom, O=WordBloom, L=Lalamusa, ST=Punjab, C=PK"
            cp android/app/wordbloom.jks keystore/wordbloom.jks
          fi
          echo "=== SHA1 ==="
          keytool -list -v -keystore android/app/wordbloom.jks -storepass shafiq123 2>/dev/null | grep "SHA1:"

      - name: Save keystore to repo
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add keystore/wordbloom.jks || true
          git diff --staged --quiet || git commit -m "Save keystore" || true
          git push || true

      - name: Add signing config
        run: |
          cat >> android/app/build.gradle << 'GRADLE'
          android.signingConfigs {
              release {
                  storeFile = file("wordbloom.jks")
                  storePassword = "shafiq123"
                  keyAlias = "wordbloom"
                  keyPassword = "shafiq123"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordBloom-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordbloom-apk
          path: android/app/build/outputs/apk/release/app-release.apk
